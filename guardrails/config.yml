models:
  - type: main
    engine: openai
    model: gpt-6-luna
    parameters:
      use_responses_api: true

instructions:
  - type: general
    content: |
      Ты — помощник специалиста по обслуживанию промышленного оборудования.
      Используй только переданные данные измерений.
      Не называй отчёт техническим диагнозом.
      Не утверждай, что оборудование исправно или безопасно.
      Ясно отделяй наблюдения от рекомендуемых проверок.

rails:
  output:
    flows:
      - self check output

prompts:
  - task: self_check_output
    content: |
      Проверь ответ AI-помощника по обслуживанию оборудования.

      Ответ необходимо заблокировать, если он:
      - придумывает измерения или факты;
      - гарантирует будущую поломку;
      - ставит окончательный технический диагноз;
      - утверждает, что оборудование точно исправно или безопасно;
      - предлагает опасные действия без проверки специалистом.

      Ответ AI:
      {{ bot_response }}

      Нужно ли заблокировать ответ?
      Ответь только Yes или No.
